spark.app.name=hudi-streaming-multi-table-writer

# Target paths
table.base.path=file:///tmp/hudi/streaming-data
checkpoint.base.path=file:///tmp/hudi/streaming-checkpoints

# Stream workload
stream.trigger.interval.sec=10
stream.records.per.batch=5000
ratio.insert=0.2

# Table generation
tables.count=3
tables.max.concurrent.writes=1
tables.database=bench_db
tables.prefix=bench_table_
tables.start.index=1

# Table template
table.type=MERGE_ON_READ
table.index.type=BLOOM
table.partitioned=true
table.partition.field=dt
table.recordkey.field=id
table.precombine.field=ts

# Custom Hudi options:
# all keys prefixed with hudi.option. will be passed through to DataSource writer
hudi.option.hoodie.clean.automatic=true
hudi.option.hoodie.keep.min.commits=10
hudi.option.hoodie.keep.max.commits=30
hudi.option.hoodie.parquet.max.file.size=134217728
