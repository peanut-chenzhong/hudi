spark.app.name=hudi-streaming-multi-table-writer-mor

# ======================
# Storage and checkpoint
# ======================
table.base.path=hdfs:///apps/hudi/bench/data
checkpoint.base.path=hdfs:///apps/hudi/bench/checkpoints

# ======================
# Stream workload
# ======================
stream.trigger.interval.sec=10
stream.records.per.batch=20000
ratio.insert=0.2

# ======================
# Multi-table generation
# ======================
tables.count=10
tables.max.concurrent.writes=20
tables.database=bench_db
tables.prefix=mor_bench_
tables.start.index=1

# ======================
# Table template
# ======================
table.type=MERGE_ON_READ
table.index.type=BLOOM
table.partitioned=true
table.partition.field=dt
table.recordkey.field=id
table.precombine.field=ts

# ======================
# Common production options
# ======================
hudi.option.hoodie.clean.automatic=true
hudi.option.hoodie.keep.min.commits=20
hudi.option.hoodie.keep.max.commits=60
hudi.option.hoodie.metadata.enable=true
hudi.option.hoodie.parquet.max.file.size=134217728
hudi.option.hoodie.parquet.small.file.limit=67108864
hudi.option.hoodie.datasource.write.insert.drop.duplicates=false

# MOR-specific options
hudi.option.hoodie.compact.inline=false
hudi.option.hoodie.compact.inline.max.delta.commits=10
hudi.option.hoodie.logfile.max.size=268435456
hudi.option.hoodie.datasource.write.payload.class=org.apache.hudi.common.model.DefaultHoodieRecordPayload

# ======================
# Hive sync options (optional)
# ======================
# database/table/partition_fields are auto-derived per target table.
hudi.option.hoodie.datasource.hive_sync.enable=true
hudi.option.hoodie.datasource.hive_sync.mode=hms
hudi.option.hoodie.datasource.hive_sync.support_timestamp=true

