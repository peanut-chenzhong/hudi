name: Spark4 JDK21 Validation

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "pom.xml"
      - "hudi-client/**"
      - "hudi-spark-datasource/**"
      - "packaging/hudi-spark-bundle/**"
      - ".github/workflows/spark4_jdk21_validation.yml"

jobs:
  spark4_jdk21_build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Compile Spark4 modules
        run: >
          mvn -Dscala-2.13 -Dspark4.0
          -Drat.skip=true -DskipTests
          -pl hudi-client/hudi-spark-client,hudi-spark-datasource/hudi-spark-common,hudi-spark-datasource/hudi-spark4-common,hudi-spark-datasource/hudi-spark4.0.x,hudi-spark-datasource/hudi-spark
          -am compile

      - name: Build Spark4 bundle
        run: >
          mvn -Dscala-2.13 -Dspark4.0
          -Drat.skip=true -Dmaven.test.skip=true -DskipTests
          -pl packaging/hudi-spark-bundle
          -am package
